<svg width="400" height="240" viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Canvas / Screen -->
  <rect width="400" height="240" fill="#090D16"/>
  
  <line x1="20" y1="40" x2="380" y2="40" stroke="#1F2937" stroke-dasharray="4 4" stroke-width="1"/>
  <text x="20" y="30" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">OPTION 3: Soft Pill-Bridge with 32px Radius Shoulders</text>

  <defs>
    <filter id="shadow3" x="0" y="85" width="400" height="155" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="-8" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="-1" stdDeviation="6" flood-color="#2E8B57" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="barGrad3" x1="200" y1="105" x2="200" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151C28"/>
      <stop offset="0.4" stop-color="#0E131C"/>
      <stop offset="1" stop-color="#06080E"/>
    </linearGradient>
  </defs>

  <!-- Pill Bridge Container: Inset 12px sides, 32px Top Radii, Connected to bottom -->
  <path d="M 14 142 
           A 32 32 0 0 1 46 110 
           L 354 110 
           A 32 32 0 0 1 386 142 
           L 386 240 
           L 14 240 Z" 
        fill="url(#barGrad3)" 
        stroke="#232D3F" 
        stroke-width="1.5"
        filter="url(#shadow3)"/>

  <!-- Top Ambient Glow Pill Line -->
  <rect x="170" y="116" width="60" height="3.5" rx="1.75" fill="rgba(255,255,255,0.2)"/>

  <!-- 1. Projects Tab -->
  <g transform="translate(60, 148)">
    <path d="M -10 -2 L -4 -2 L -2 0 L 10 0 C 11 0 12 1 12 2 L 12 8 C 12 9 11 10 10 10 L -10 10 C -11 10 -12 9 -12 8 L -12 0 C -12 -1 -11 -2 -10 -2 Z" stroke="#9CA3AF" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
    <text x="0" y="24" text-anchor="middle" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="500">Projects</text>
  </g>

  <!-- 2. Capture Tab (Active State with Sea Green Pill Glow) -->
  <g transform="translate(153, 148)">
    <rect x="-26" y="-12" width="52" height="46" rx="14" fill="rgba(46, 139, 87, 0.18)" stroke="#2E8B57" stroke-width="1"/>
    <!-- Camera Icon -->
    <rect x="-10" y="-3" width="20" height="15" rx="3" stroke="#2E8B57" stroke-width="2" fill="none"/>
    <circle cx="0" cy="4.5" r="3.5" stroke="#2E8B57" stroke-width="2" fill="none"/>
    <!-- Red Background Spinner Badge -->
    <circle cx="10" cy="-5" r="4.5" fill="#EF4444"/>
    <circle cx="10" cy="-5" r="2.5" fill="#FFFFFF"/>
    <text x="0" y="24" text-anchor="middle" fill="#2E8B57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700">Capture</text>
  </g>

  <!-- 3. History Tab -->
  <g transform="translate(247, 148)">
    <circle cx="0" cy="4.5" r="8" stroke="#9CA3AF" stroke-width="1.8" fill="none"/>
    <path d="M 0 0.5 L 0 4.5 L 3.5 6.5" stroke="#9CA3AF" stroke-width="1.8" stroke-linecap="round"/>
    <text x="0" y="24" text-anchor="middle" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="500">History</text>
  </g>

  <!-- 4. Settings Tab -->
  <g transform="translate(340, 148)">
    <circle cx="0" cy="4.5" r="7.5" stroke="#9CA3AF" stroke-width="1.8" fill="none"/>
    <circle cx="0" cy="4.5" r="2.5" fill="#9CA3AF"/>
    <text x="0" y="24" text-anchor="middle" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="500">Settings</text>
  </g>

  <!-- Home Indicator Bar -->
  <rect x="135" y="222" width="130" height="4" rx="2" fill="#4B5563"/>
</svg>
