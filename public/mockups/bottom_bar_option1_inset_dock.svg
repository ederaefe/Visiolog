<svg width="400" height="240" viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Canvas / Screen -->
  <rect width="400" height="240" fill="#090D16"/>
  
  <!-- Subtle Grid Context -->
  <line x1="20" y1="40" x2="380" y2="40" stroke="#1F2937" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="20" y1="80" x2="380" y2="80" stroke="#1F2937" stroke-dasharray="4 4" stroke-width="1"/>
  <text x="20" y="30" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">OPTION 1: Inset Floating Dock with Curved Top Corners</text>

  <!-- Drop Shadow Glow for Bottom Bar -->
  <defs>
    <filter id="shadow1" x="6" y="90" width="388" height="150" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="-4" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="-1" stdDeviation="4" flood-color="#2E8B57" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="barGrad1" x1="200" y1="110" x2="200" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141923"/>
      <stop offset="1" stop-color="#090D16"/>
    </linearGradient>
  </defs>

  <!-- Bottom Navigation Bar: Inset 16px from side screens, Top Rounded 24px, Flush to bottom -->
  <path d="M 20 134 
           A 24 24 0 0 1 44 110 
           L 356 110 
           A 24 24 0 0 1 380 134 
           L 380 240 
           L 20 240 Z" 
        fill="url(#barGrad1)" 
        stroke="#283245" 
        stroke-width="1.5"
        filter="url(#shadow1)"/>

  <!-- Top Accent Highlight Line -->
  <path d="M 44 110 L 356 110" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- 1. Projects Tab (Active - Sea Green) -->
  <g transform="translate(65, 140)">
    <rect x="-24" y="-8" width="48" height="40" rx="12" fill="rgba(46, 139, 87, 0.15)"/>
    <!-- Folder Icon -->
    <path d="M -10 -2 L -4 -2 L -2 0 L 10 0 C 11 0 12 1 12 2 L 12 8 C 12 9 11 10 10 10 L -10 10 C -11 10 -12 9 -12 8 L -12 0 C -12 -1 -11 -2 -10 -2 Z" stroke="#2E8B57" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <text x="0" y="24" text-anchor="middle" fill="#2E8B57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700">Projects</text>
  </g>

  <!-- 2. Capture Tab (Camera + Red Badge) -->
  <g transform="translate(155, 140)">
    <!-- Camera Icon -->
    <rect x="-10" y="-3" width="20" height="15" rx="3" stroke="#9CA3AF" stroke-width="1.8" fill="none"/>
    <circle cx="0" cy="4.5" r="3.5" stroke="#9CA3AF" stroke-width="1.8" fill="none"/>
    <path d="M -4 -3 L -2 -6 L 2 -6 L 4 -3" stroke="#9CA3AF" stroke-width="1.5" fill="none"/>
    <!-- Red Background Spinner Badge -->
    <circle cx="9" cy="-4" r="4.5" fill="#EF4444"/>
    <circle cx="9" cy="-4" r="2.5" fill="#FFFFFF"/>
    <text x="0" y="24" text-anchor="middle" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="500">Capture</text>
  </g>

  <!-- 3. History Tab -->
  <g transform="translate(245, 140)">
    <!-- Clock/History Icon -->
    <circle cx="0" cy="4.5" r="8" stroke="#9CA3AF" stroke-width="1.8" fill="none"/>
    <path d="M 0 0.5 L 0 4.5 L 3.5 6.5" stroke="#9CA3AF" stroke-width="1.8" stroke-linecap="round"/>
    <text x="0" y="24" text-anchor="middle" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="500">History</text>
  </g>

  <!-- 4. Settings Tab -->
  <g transform="translate(335, 140)">
    <!-- Sliders/Settings Icon -->
    <circle cx="0" cy="4.5" r="7.5" stroke="#9CA3AF" stroke-width="1.8" fill="none"/>
    <circle cx="0" cy="4.5" r="2.5" fill="#9CA3AF"/>
    <text x="0" y="24" text-anchor="middle" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="500">Settings</text>
  </g>

  <!-- Home Indicator Bar (iOS / Android) -->
  <rect x="135" y="222" width="130" height="4" rx="2" fill="#4B5563"/>
</svg>
